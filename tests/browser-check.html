<!doctype html><meta charset="utf-8"><title>Bridge file integration test</title><output>Pairing two test devicesâ€¦</output>
<script type="module">
import {Bridge} from '/src/lib/bridge.ts';
import {useSession} from '/src/store/session.ts';
import {useTransfers} from '/src/store/transfers.ts';
const client = new Bridge();
const result = document.querySelector('output');
async function wait(get) {
  const end=Date.now()+65000;
  while(Date.now()<end){const value=get(); if(value)return value; await new Promise(r=>setTimeout(r,50));}
  throw Error('Timed out: '+useSession.getState().status+' '+useSession.getState().error);
}
window.testDevice={client,state:useSession.getState,subscribe:useSession.subscribe,getTransfers:useTransfers.getState};
async function test(){
  const guest=document.createElement('iframe'); guest.src='?guest'; document.body.append(guest);
  const peer=await wait(()=>guest.contentWindow.testDevice);
  await client.start();
  const confirmWhenSymbolsAppear = (device, id) => device.subscribe(state => {
    const link = state.devices.find(row => row.id === id && row.sas);
    if (!link) return;
    results.push(!link.connected);
    const unsubscribe = id === 1 ? guestSubscription : hostSubscription;
    unsubscribe();
    void device.client.verify(id).catch(error => result.textContent = String(error));
  });
  const results = [];
  const hostSubscription = confirmWhenSymbolsAppear(window.testDevice, 2);
  const guestSubscription = confirmWhenSymbolsAppear(peer, 1);
  await peer.client.start(await wait(()=>useSession.getState().url));
  await wait(()=>peer.state().recipient === 1 && useSession.getState().recipient === 2);
  if (results.length !== 2 || results.some(early => !early)) throw Error('Verification did not start before the data channels opened');
  await client.sendText('clipboard check'); await wait(()=>peer.state().clips.some(c=>c.text==='clipboard check'));
  const secondGuest = document.createElement('iframe');
  secondGuest.src = '?guest';
  document.body.append(secondGuest);
  const third = await wait(() => secondGuest.contentWindow.testDevice);
  await third.client.start(useSession.getState().url);
  await wait(() => third.state().devices.some(device => device.id === 1 && device.connected)
    && useSession.getState().devices.some(device => device.id === 3 && device.connected));
  await client.verify(3);
  await third.client.verify(1);
  await wait(() => useSession.getState().devices.filter(device => device.ready).length === 2 && third.state().recipient === 1);
  client.select(2);
  await client.sendText('only device 2');
  await client.sendText('all devices', true);
  await wait(() => third.state().clips.some(c => c.text === 'all devices') && peer.state().clips.some(c => c.text === 'all devices'));
  if (third.state().clips.some(c => c.text === 'only device 2')) throw Error('Targeted clipboard was delivered to the wrong device');
  peer.client.connect(3);
  await wait(() => peer.state().devices.some(d => d.id === 3 && d.connected)
    && third.state().devices.some(d => d.id === 2 && d.connected));
  await peer.client.verify(3);
  await third.client.verify(2);
  await wait(() => peer.state().devices.some(d => d.id === 3 && d.ready));
  peer.client.select(3);
  await peer.client.sendText('guest to guest');
  await wait(() => third.state().clips.some(c => c.text === 'guest to guest'));
  peer.client.select(1);
  third.client.select(1);
  result.textContent='Paired. Testing encrypted folder data and ZIP downloadâ€¦';
  const native=new URLSearchParams(location.search).has('native');
  // Native mode also exercises Chromium's download manager in an isolated browser profile.
  const anchorClick=guest.contentWindow.HTMLAnchorElement.prototype.click;
  let download;
  guest.contentWindow.HTMLAnchorElement.prototype.click=function(){ download=fetch(this.href).then(r=>r.arrayBuffer()); if(native)anchorClick.call(this); };
  const data=new Uint8Array(3*1024*1024+37);
  for(let i=0;i<data.length;i++)data[i]=i%251;
  await client.sendFiles([{file:new File([data],'sample.bin'),path:'Folder/nested/sample.bin'},
    {file:new File([],'empty.txt'),path:'Folder/empty.txt'}]);
  const row=useTransfers.getState().queue.at(-1);
  if(row.status!=='Complete')throw Error(row.detail||row.status);
  const archive=new Uint8Array(await download), h=new DataView(archive.buffer);
  function check(pos,path,bytes){
    if(h.getUint32(pos,true)!==0x04034b50) throw Error('Invalid ZIP header');
    const nameLen=h.getUint16(pos+26,true), start=pos+30+nameLen+h.getUint16(pos+28,true);
    if(new TextDecoder().decode(archive.subarray(pos+30,pos+30+nameLen))!==path)throw Error('Path mismatch');
    if(!bytes.every((b,i)=>archive[start+i]===b))throw Error('Contents differ');
    return start+bytes.length;
  }
  check(check(0,'Folder/nested/sample.bin',data),'Folder/empty.txt',[]);
  if(h.getUint32(archive.length-22,true)!==0x06054b50)throw Error('Missing ZIP directory');
  const thirdQueue = third.getTransfers().queue;
  if (thirdQueue.some(row => row.label.includes('Folder'))) throw Error('Folder reached the wrong device');
  result.textContent='Passed: three devices verified, exchanged targeted and broadcast clipboard text, and transferred a 3 MiB nested folder to the selected device only.';
  if(native) {
    const name='Module 4.1 (2).pdf';
    const sample=new File(['%PDF-1.4\nBridge download test\n%%EOF'],name,{type:'application/pdf'});
    await peer.client.sendFiles([{file:sample,path:name}]);
    const row=useTransfers.getState().queue.at(-1);
    if(!row.download || row.download.name!==name)throw Error('Original filename lost');
    client.close();peer.client.close();
    const retry=document.createElement('a');retry.textContent='Retry received PDF'; retry.href=row.download.url;retry.download=row.download.name;
    document.body.append(retry);
    result.textContent='Native downloads ready';
  } else {client.close(); peer.client.close(); third.client.close();}
}
if(!new URLSearchParams(location.search).has('guest'))test().catch(e=>result.textContent=String(e));
</script>
